<!doctype html><meta charset="utf-8"><pre id="result">Loading</pre><canvas id="output"></canvas>
<script src="../opencv.js"></script><script src="../assets/a4-document-detector.js"></script>
<script>
(async () => {
  window.cv = await window.cv;
  const state = { opencvReady: true, scanMode: 'opencv' };
  const html = await (await fetch('../HamGiang.html', { cache: 'no-store' })).text();
  eval(html.slice(html.indexOf('    function detectDocumentBounds('), html.indexOf('    function preparePdfImage(')));
  const img = new Image(); img.src = '../test.jpg'; await img.decode();
  const source = document.createElement('canvas'); source.width = img.width; source.height = img.height;
  source.getContext('2d').drawImage(img, 0, 0);
  const opts = { documentType: 'document', preferSpread: true, targetLongEdge: 3308 };
  const before = performance.now();
  const bounds = detectDocumentBounds(source, 'opencv', opts);
  const openCv = detectDocumentWithOpenCv(source, false, opts);
  const preview = detectDocumentWithOpenCv(source, false, { fast: true, maxDimension: 480 });
  const scan = prepareScan(source, opts);
  const output = document.getElementById('output'); output.width = scan.canvas.width; output.height = scan.canvas.height;
  output.getContext('2d').drawImage(scan.canvas, 0, 0);
  document.getElementById('result').textContent = JSON.stringify({bounds, openCv, preview, width: output.width, height: output.height, ms: performance.now()-before});
  document.body.dataset.done = 'true';
})().catch(error => { document.getElementById('result').textContent=error.stack; document.body.dataset.done='error'; });
</script>
